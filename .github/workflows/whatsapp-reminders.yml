name: WhatsApp Reminders

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send upcoming appointment reminders
        env:
          ALINDA_CRON_SECRET: ${{ secrets.ALINDA_CRON_SECRET }}
        run: |
          test -n "$ALINDA_CRON_SECRET"
          curl --fail-with-body -sS -X POST \
            "https://alinda-booking--alinda-booking-9e08d.europe-west4.hosted.app/api/whatsapp/reminder" \
            -H "Authorization: Bearer $ALINDA_CRON_SECRET"
