name: WhatsApp Reminders

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send upcoming appointment reminders
        env:
          ALINDA_APP_URL: ${{ secrets.ALINDA_APP_URL }}
          ALINDA_CRON_SECRET: ${{ secrets.ALINDA_CRON_SECRET }}
        run: |
          test -n "$ALINDA_APP_URL"
          test -n "$ALINDA_CRON_SECRET"
          curl --fail-with-body -sS -X POST "$ALINDA_APP_URL/api/whatsapp/reminder" \
            -H "Authorization: Bearer $ALINDA_CRON_SECRET"
