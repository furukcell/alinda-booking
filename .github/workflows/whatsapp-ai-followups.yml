name: WhatsApp AI Follow-ups

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Offer AI assistant after 10 minutes
        env:
          ALINDA_APP_URL: ${{ secrets.ALINDA_APP_URL }}
          ALINDA_CRON_SECRET: ${{ secrets.ALINDA_CRON_SECRET }}
        run: |
          test -n "$ALINDA_APP_URL"
          test -n "$ALINDA_CRON_SECRET"
          curl --fail-with-body -sS -X POST "$ALINDA_APP_URL/api/whatsapp/ai-followups"             -H "Authorization: Bearer $ALINDA_CRON_SECRET"
