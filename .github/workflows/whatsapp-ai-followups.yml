name: WhatsApp AI Follow-ups

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Offer AI assistant after 10 minutes
        env:
          ALINDA_CRON_SECRET: ${{ secrets.ALINDA_CRON_SECRET }}
        run: |
          if [ -z "$ALINDA_CRON_SECRET" ]; then
            echo "::warning::ALINDA_CRON_SECRET is not configured; WhatsApp scheduled task was skipped."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${ALINDA_CRON_SECRET}" \
            https://alinda-booking--alinda-booking-9e0d8.europe-west4.hosted.app/api/whatsapp/ai-followups
